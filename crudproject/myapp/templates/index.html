<html lang="en">
<head>

    <style>

            width: 100%;

        th {

        }
            a {
                text-decoration: none;

                text-align: center;
                
            }
        a:hover {
                    color: red;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <th>id</th>

        <tr>
