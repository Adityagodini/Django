<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             background-image: url("{% static 'images/salaar_wallpaper.jpeg' %}");
              background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
                height: 100vh;
                color: white;
                font-weight: bolder;
        }

        body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: -1;
}
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        h1{
            text-align:center;
            color:rgb(42, 156, 218);

        }
    </style>
    
</head>
<body>
    <h1>Student Database</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
            <th>Date of Birth</th>
            <th>Email</th>
        </tr>
        {% for i in stud %}
        <tr>
            <td>{{i.name}} </td>
            <td>{{i.age}} </td>
            <td>{{i.place}} </td>
            <td>{{i.dob}} </td>
            <td>{{i.email}} </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
