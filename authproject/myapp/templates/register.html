<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        h1{
            text-align: center;
        }
        form{
            width: 400px;
            margin: auto;
            border: 1px solid rgb(207, 38, 38);
            padding: 20px;
            /* background-image:url(/Web/images/salaar_wallpaper.jpeg);
            background-size:439px 834px;;
            background-repeat: no-repeat; */
            background-color: rgb(149, 208, 230);
            border-radius: 16px;
        }
         input[type="text"],
         input[type="email"],
         input[type="tel"],
        input[type="password"],
        input[type="date"],
    
        select{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 2px solid #270b0b;
            border-radius: 16px;
        }
            input[type="submit"]{
                width: 100%;
                padding: 10px;
                background-color: blue;
                color: white;
                border: none;
                cursor: pointer;
                margin: 5PX 0px;
            }
            input[type="submit"]:hover{
                background-color: darkblue;
            }

            input[type="radio"]{
                width: auto;
                margin: 0 5px;
                padding: 12px 20px;
            }

           p,a{
            text-align: center;
           }
    </style>
</head>
<body>
    <form  method="Post">
        {% csrf_token %}
        <fieldset>
            <h1>SignUp</h1>
            User Name: <input type="text" name="username" id="" placeholder="Enter your name" required> <br>
            <br>
            Email: <input type="email" name="email" id="" placeholder="Enter your email" required> <br>
            <br>
            Password: <input type="password" name="password" id="" placeholder="Enter your password" required> <br>
            <!-- Confirm Password: <input type="password" name="confirm_password" id="" placeholder="confirm your password" required> <br> <br> -->
            <input type="submit" value="SignUp">
            <p>Already have an account <a href="{% url 'login' %}">Login</a></p>
        </fieldset>


    </form>
</body>
</html>
